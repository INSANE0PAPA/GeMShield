<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="GeMShield - Evidence-Grounded Bid Verification for GeM Procurement" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="210" rx="14"/></clipPath>
    <clipPath id="bar"><rect x="0" y="198" width="900" height="12"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="210" fill="url(#bg)"/>
    <rect x="0.5" y="0.5" width="899" height="209" rx="14" fill="none" stroke="#d3dce8"/>

    <!-- title -->
    <text x="450" y="102" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="58" font-weight="800" fill="#0b2a5b" letter-spacing="1">GeM<tspan fill="#1d4ed8">Shield</tspan></text>

    <text x="450" y="146" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="18" fill="#475569">Evidence-Grounded Bid Verification for GeM Procurement</text>
    <text x="450" y="172" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="12" letter-spacing="3" fill="#7b8794">NO EVIDENCE  →  NO DECISION</text>

    <!-- accent strip with one slow highlight -->
    <rect x="0"   y="198" width="300" height="12" fill="#ff9933"/>
    <rect x="300" y="198" width="300" height="12" fill="#ffffff"/>
    <rect x="600" y="198" width="300" height="12" fill="#138808"/>
    <g clip-path="url(#bar)">
      <rect x="-200" y="198" width="200" height="12" fill="url(#sweep)">
        <animate attributeName="x" values="-200;900" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
